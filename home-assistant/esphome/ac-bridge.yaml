

api:
  encryption:
    key: "pZ7p7ybeGmHYS+7rFk3Mj2tKwepuOOT/bDaCifUYIow="

ota:
  - platform: esphome
    password: "anything-you-want-here"

output:
  - platform: gpio
    id: onboard_led_output
    pin:
      number: GPIO15
      inverted: true

esphome:
  name: ac-bridge
  friendly_name: AC Bridge
  on_boot:
    priority: -10
    then:
      - output.turn_on: onboard_led_output



esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0   # disable logger UART so it doesn't fight our ac_bus


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AC Bridge Fallback"
    password: "12345678"


captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/GrKoR/esphome_aux_ac_component

uart:
  id: ac_uart_bus
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1

climate:
  - platform: aux_ac
    name: "Living Room AC"
    id: aux_id
    uart_id: ac_uart_bus
    period: 7s
    show_action: true
    indoor_temperature:
      name: "AC Indoor Temperature"
    outdoor_temperature:
      name: "AC Outdoor Temperature"
    display_state:
      name: "AC Display State"
    supported_modes:
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY