esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: WARN
  baud_rate: 0

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${ap_name} Fallback Hotspot"
    password: !secret hotspot_password

captive_portal:

output:
  - platform: gpio
    id: onboard_led_output
    pin:
      number: GPIO8    # C3 SuperMini onboard LED
      inverted: true

external_components:
  - source:
      type: git
      url: https://github.com/GrKoR/esphome_aux_ac_component

uart:
  id: ac_uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1

climate:
  - platform: aux_ac
    name: ${climate_name}
    id: aux_id
    uart_id: ac_uart_bus
    period: 7s
    show_action: true
    supported_modes:
      - COOL
    indoor_temperature:
      name: "AC Indoor Temperature"
      internal: false
    outdoor_temperature:
      name: "AC Outdoor Temperature"
    display_state:
      name: "AC Display State"
