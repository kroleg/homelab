services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.3
    volumes:
      - .:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    privileged: true
    network_mode: host
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto:/mosquitto/config
    ports:
      - "1883:1883"
    restart: unless-stopped

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2026.5
    volumes:
      - ./esphome:/config
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - 'c 188:* rmw'  # /dev/ttyUSB*
      - 'c 166:* rmw'  # /dev/ttyACM*
    environment:
      - TZ=Europe/Moscow
      - ESPHOME_DASHBOARD_USE_PING=true
    restart: unless-stopped
    network_mode: host
