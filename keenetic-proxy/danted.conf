logoutput: stderr
internal: 192.168.1.250 port = 1080
external: 192.168.1.250
user.privileged: root
user.unprivileged: proxyout
clientmethod: none
socksmethod: none

# Only Keenetic may use this proxy.
client pass {
    from: 192.168.1.1/32 to: 192.168.1.250/32
    log: connect disconnect error
}
client block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}
# SOCKS UDP association starts with an unspecified client address/port.
# Permit only this control request before the special-destination blocks.
socks pass {
    from: 192.168.1.1/32 to: 0.0.0.0/32 port = 0
    command: udpassociate
    protocol: udp
    log: connect disconnect error
}
# Replies belong to established UDP associations and return to Keenetic.
socks pass {
    from: 0.0.0.0/0 to: 192.168.1.1/32
    command: udpreply
    protocol: udp
    log: connect disconnect error
}
# Do not allow the proxy to connect back to itself or into private networks.
socks block { from: 0.0.0.0/0 to: 0.0.0.0/8 log: connect error }
socks block { from: 0.0.0.0/0 to: 10.0.0.0/8 log: connect error }
socks block { from: 0.0.0.0/0 to: 100.64.0.0/10 log: connect error }
socks block { from: 0.0.0.0/0 to: 127.0.0.0/8 log: connect error }
socks block { from: 0.0.0.0/0 to: 169.254.0.0/16 log: connect error }
socks block { from: 0.0.0.0/0 to: 172.16.0.0/12 log: connect error }
socks block { from: 0.0.0.0/0 to: 192.168.0.0/16 log: connect error }
socks block { from: 0.0.0.0/0 to: 224.0.0.0/3 log: connect error }
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    protocol: tcp
    log: connect disconnect error
}
socks pass {
    from: 192.168.1.1/32 to: 0.0.0.0/0
    command: udpassociate
    protocol: udp
    log: connect disconnect error
}
